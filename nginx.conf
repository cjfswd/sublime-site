server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|png|jpg|jpeg|svg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  gzip on;
  gzip_types text/plain text/css image/svg+xml;
}
